services:
  mentora-backend:
    build:
      context: ./mentora-backend
      dockerfile: Dockerfile
    container_name: mentora-backend
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - MENTORA_DB_URL=${MENTORA_DB_URL:?MENTORA_DB_URL is required}
      - MENTORA_DB_USER=${MENTORA_DB_USER:?MENTORA_DB_USER is required}
      - MENTORA_DB_PASS=${MENTORA_DB_PASS:?MENTORA_DB_PASS is required}
      - MENTORA_JWT_SECRET=${MENTORA_JWT_SECRET:?MENTORA_JWT_SECRET is required}
      - MENTORA_CORS_ORIGINS=${MENTORA_CORS_ORIGINS:?MENTORA_CORS_ORIGINS is required}
      - MENTORA_BOOTSTRAP_ADMIN_ENABLED=${MENTORA_BOOTSTRAP_ADMIN_ENABLED:-false}
      - MENTORA_BOOTSTRAP_ADMIN_EMAIL=${MENTORA_BOOTSTRAP_ADMIN_EMAIL:-admin@mentora.com}
      - MENTORA_BOOTSTRAP_ADMIN_PASSWORD=${MENTORA_BOOTSTRAP_ADMIN_PASSWORD:-}
    volumes:
      - mentora_uploads:/app/uploads

  mentora-frontend:
    build:
      context: ./mentora-frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:?VITE_API_URL is required}
    container_name: mentora-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - mentora-backend

volumes:
  mentora_uploads:
    driver: local
