server:
  port: 8081
  servlet:
    context-path: /
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml
    min-response-size: 512

spring:
  application:
    name: mentora-backend
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  datasource:
    # TiDB Cloud Serverless (MySQL-compatible)
    # SECURITY: Credentials loaded from environment variables (MENTORA_DB_URL, MENTORA_DB_USER, MENTORA_DB_PASS)
    # Fallback to local dev values only — never hardcode production credentials here.
    url: ${MENTORA_DB_URL:jdbc:mysql://gateway01.ap-southeast-1.prod.aws.tidbcloud.com:4000/mentora?sslMode=REQUIRED&enabledTLSProtocols=TLSv1.2,TLSv1.3&allowPublicKeyRetrieval=true}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MENTORA_DB_USER:3Q9njwBTT5gHaSW.root}
    password: ${MENTORA_DB_PASS:Fj7IWdxW7C2v5xNq}
    # HikariCP connection pool — BUG FIX: reduce maxLifetime below TiDB's 5-min server timeout
    # to prevent "connection closed" validation failures on idle connections
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 120000          # 2 minutes
      max-lifetime: 180000          # 3 minutes (< TiDB's ~5 min server timeout)
      connection-timeout: 30000     # 30 seconds
      keepalive-time: 60000         # ping every 60s to keep connection alive
      connection-test-query: SELECT 1
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

# JWT Security Configurations
# SECURITY: jwtSecret loaded from environment variable MENTORA_JWT_SECRET
# Use a strong random 256-bit hex value in production (never the default below).
mentora:
  app:
    jwtSecret: ${MENTORA_JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    jwtExpirationMs: 86400000 # 24 hours
  cors:
    # Allowed origins for frontend local and cloud deployments (* allows all domains including Vercel/Netlify)
    allowed-origins: ${MENTORA_CORS_ORIGINS:*}

# SpringDoc OpenAPI Documentation
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
