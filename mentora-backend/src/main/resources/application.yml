server:
  port: ${PORT:8081}
  servlet:
    context-path: /
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml
    min-response-size: 512

spring:
  application:
    name: mentora-backend
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  datasource:
    # Local development is self-contained. Production overrides this in application-prod.yml.
    url: jdbc:h2:mem:mentoradb;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  h2:
    console:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

# JWT Security Configurations
# SECURITY: jwtSecret loaded from environment variable MENTORA_JWT_SECRET
# Use a strong random 256-bit hex value in production (never the default below).
mentora:
  app:
    jwtSecret: ${MENTORA_JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    jwtExpirationMs: 86400000 # 24 hours
  cors:
    allowed-origins: ${MENTORA_CORS_ORIGINS:http://localhost:3000}
  bootstrap:
    admin:
      enabled: ${MENTORA_BOOTSTRAP_ADMIN_ENABLED:true}
      email: ${MENTORA_BOOTSTRAP_ADMIN_EMAIL:admin@mentora.com}
      password: ${MENTORA_BOOTSTRAP_ADMIN_PASSWORD:admin@mentora}
# SpringDoc OpenAPI Documentation
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
