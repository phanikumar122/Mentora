spring:
  datasource:
    url: ${MENTORA_DB_URL}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MENTORA_DB_USER}
    password: ${MENTORA_DB_PASS}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 120000
      max-lifetime: 180000
      connection-timeout: 30000
      keepalive-time: 60000
      connection-test-query: SELECT 1
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: validate

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

mentora:
  app:
    jwtSecret: ${MENTORA_JWT_SECRET}
  bootstrap:
    admin:
      enabled: ${MENTORA_BOOTSTRAP_ADMIN_ENABLED:false}
      email: ${MENTORA_BOOTSTRAP_ADMIN_EMAIL:admin@mentora.com}
      password: ${MENTORA_BOOTSTRAP_ADMIN_PASSWORD:}